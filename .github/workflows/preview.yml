# Plan morning-digest § 3 and § 4. Saves /digest/2026-10-28 as one HTML file with a command and
# publishes it to GitHub Pages as an artifact: the preview is never committed (ADR 0003).
# Clean-up: run again with marker=false; it uploads over the same link.
name: preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Show this lane's marker (false for the clean-up upload)
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
          PORT: 8787
        run: |
          mkdir -p _site
          pnpm start > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/health > /dev/null && break; sleep 1; done
          curl -sf localhost:8787/digest/2026-10-28 -o _site/index.html
          if [ "${{ inputs.marker }}" = "true" ]; then
            ! grep -q 'no marker set' _site/index.html
          else
            grep -q 'no marker set' _site/index.html
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
